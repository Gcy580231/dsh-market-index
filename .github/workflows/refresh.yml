name: refresh index

on:
  schedule:
    # 每天 20:17 UTC（= 北京时间次日 04:17）重跑
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'generate.mjs'
      - '.github/workflows/refresh.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 官方校验器：生成器用它的 parseMarketIndex 做解析驱动自愈。
      # 装不上不是致命错误 —— 生成器会退回结构自检（净化规则仍然生效）。
      - name: Install official index validator
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 150 npm install --no-audit --no-fund 2>&1 | tee npm-install.log || echo "validator install skipped"

      - name: Generate index
        run: |
          set -o pipefail
          node generate.mjs index.json 2>&1 | tee generate.log

      - name: Commit when changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged — nothing to commit"
          else
            git commit -m "refresh index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      # jsDelivr 对 `@main` 的缓存是 12 小时——不主动 purge 的话，消费方最长要等 12h
      # 才看到新一轮内容。raw.githubusercontent 自己的 TTL 是 5 分钟，但实测在部分网络
      # （经代理时）会明显更久，所以把它降级为备用线路。
      - name: Purge jsDelivr @main cache
        if: success()
        run: |
          curl -sS --max-time 30 -X GET "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/index.json" || true

      # 把这次运行的输出落到仓库里，失败原因不必再靠人肉翻 Actions 面板。
      - name: Publish run log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo "# refresh index run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## npm install"
            echo '```'
            tail -n 40 npm-install.log 2>/dev/null || echo "(no npm-install.log)"
            echo '```'
            echo "## generate"
            echo '```'
            tail -n 60 generate.log 2>/dev/null || echo "(no generate.log)"
            echo '```'
          } > ci-last-run.md
          git add -f ci-last-run.md
          git commit -m "ci log $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push || true
